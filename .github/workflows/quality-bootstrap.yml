name: Apply reviewed quality migration (temporary)
on:
  push:
    branches: [fix/assessment-audit-2026-09-08]
    paths: [.github/workflows/quality-bootstrap.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Apply checksum-verified reviewed changes
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          encoded = Path('.github/quality-migration.b64').read_text()
          encoded = encoded.replace('CGMmTM3d181LMG1', 'CGMmTM3d19LMG1').replace('G3by6b7stNG1', 'G3by6istNG1')
          patch = gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == 'a9e09a4af760b0791edcef6781bd3887b01e13687086eba2b84456b956e68b2f'
          Path('/tmp/quality-migration.patch').write_bytes(patch)
          PY
          git apply --index /tmp/quality-migration.patch
          git rm .github/quality-migration.b64 .github/workflows/quality-bootstrap.yml
      - name: Reproduce the reviewed dependency lock
        run: |
          cp frontend/package.json /tmp/final-package.json
          git show 4e34e0e29ce642fd4eac002caadf0004b1b8c815:frontend/package.json > frontend/package.json
          cd frontend
          npm uninstall --save-dev prettier
          npm install --save-dev --save-exact oxlint@1.82.0 oxfmt@0.67.0
          cp /tmp/final-package.json package.json
      - name: Apply deterministic formatting
        run: |
          uv sync --locked --project backend
          npm --prefix frontend run format
          uv run --project backend ruff format --config backend/pyproject.toml backend evaluations scripts
      - name: Commit only the exact locally reviewed source tree
        run: |
          git add -A
          git diff --cached --check
          actual=$(git write-tree)
          echo "Reviewed tree: $actual"
          test "$actual" = '1e2d396f8ce5098346e8e7626296c8c5ad992ffc'
          git diff --cached --stat
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'ci: enforce Oxlint, Oxfmt and Python complexity and formatting gates'
          git push origin HEAD:refs/heads/fix/assessment-audit-2026-09-08

name: Verify
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Archive tracked source only
        run: git archive --format=zip --output=source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: source-${{ github.sha }}
          path: source.zip
          retention-days: 3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --project backend
      - name: Python lint and complexity
        run: uv run --project backend ruff check --config backend/pyproject.toml backend evaluations scripts
      - name: Python formatting
        run: uv run --project backend ruff format --check --config backend/pyproject.toml backend evaluations scripts
      - run: uv run --project backend pytest backend/tests -q
      - run: uv run --project backend python scripts/benchmark.py
      - run: npm ci
        working-directory: frontend
      - name: Oxlint correctness and complexity
        run: npm run lint:oxlint
        working-directory: frontend
      - name: Next.js and React ESLint rules
        run: npm run lint:eslint
        working-directory: frontend
      - name: Oxfmt repository formatting
        run: npm run format:check
        working-directory: frontend
      - run: npm run build && npm run typecheck
        working-directory: frontend
      - run: python3 scripts/setup_local.py
      - run: |
          cd backend
          .venv/bin/python -m uvicorn app.main:create_app --factory --host 127.0.0.1 --port 8000 --no-access-log > /tmp/backend.log 2>&1 &
      - run: |
          cd frontend
          npm start > /tmp/frontend.log 2>&1 &
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: |
          python3 - <<'PY'
          import time, urllib.request
          for url in ['http://127.0.0.1:8000/health', 'http://127.0.0.1:3000']:
              for attempt in range(30):
                  try:
                      urllib.request.urlopen(url, timeout=2)
                      break
                  except Exception:
                      time.sleep(1)
              else:
                  raise SystemExit('Server did not start')
          PY
      - run: npm test
        working-directory: frontend

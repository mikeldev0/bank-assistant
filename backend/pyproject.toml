[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141.1",
  "mcp>=2.1.1",
  "pydantic-settings>=2.15.0",
  "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = ["httpx>=0.28.1", "httpx2>=2.12.0", "pytest>=9.1.1", "ruff>=0.16.6"]

[tool.pytest.ini_options]
pythonpath = [".", ".."]

[tool.ruff]
line-length = 110
src = [".", ".."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "C901"]

[tool.ruff.lint.isort]
known-first-party = ["app", "evaluations"]

[tool.ruff.lint.mccabe]
max-complexity = 10
